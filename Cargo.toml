[package]
name = "napkin-uml"
version = "0.1.0"
edition = "2026"
description = "A simple UML diagram editor"

[[bin]]
name = "NapkinUML"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2

# macOS app bundle (cargo bundle): the Mac icon from icons/
[package.metadata.bundle]
name = "NapkinUML"
identifier = "net.napkinuml.app"
icon = ["icons/napkin-uml.icns"]
