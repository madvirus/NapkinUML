[package]
name = "napkin-uml"
version = "0.3.4-SNAPSHOT"
edition = "2021"
description = "A simple UML diagram editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/madvirus/NapkinUML"

[[bin]]
name = "NapkinUML"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15"
miniz_oxide = "0.8"
arboard = "3"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2

# macOS app bundle (cargo bundle): the Mac icon from icons/
[package.metadata.bundle]
name = "NapkinUML"
identifier = "net.napkinuml.app"
icon = ["icons/napkin-uml.icns"]
