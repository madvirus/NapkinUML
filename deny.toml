# cargo-deny settings: which licenses NapkinUML's dependencies may use.
# Run: cargo deny check licenses

[graph]
# Only the platforms NapkinUML is built for.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[licenses]
# Permissive licenses only. Copyleft licenses (GPL, LGPL, AGPL, ...) and source-available
# licenses (SSPL, BUSL, ...) are not allowed. MPL-2.0 needs a review before adding it here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
