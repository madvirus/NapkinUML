# Builds NapkinUML for Windows (x64, ARM64) and macOS (one app for Apple Silicon and Intel)
# on GitHub's own Windows and Mac machines. Put the app/ folder in a GitHub repository (as
# its top folder), then run this from the repository's Actions tab ("Run workflow") or by
# pushing; the programs appear as downloadable artifacts of the run.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # Dependencies may only use the licenses allowed in deny.toml.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  windows:
    needs: licenses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Build
        shell: cmd
        run: build-windows.cmd
      - uses: actions/upload-artifact@v7
        with:
          name: NapkinUML-windows
          if-no-files-found: error
          path: |
            dist/NapkinUML-x64.exe
            dist/NapkinUML-arm64.exe
            dist/THIRD-PARTY-LICENSES.html

  macos:
    needs: licenses
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Build
        run: sh build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: NapkinUML-macos
          if-no-files-found: error
          path: |
            dist/NapkinUML-macos.dmg
            dist/NapkinUML-macos.zip

  # On a "v*" tag push, publish both builds as a GitHub Release (skipped for manual runs).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        run: gh run download "${{ github.run_id }}" --dir artifacts
      # Release notes come from release-notes/<tag>.md (e.g. release-notes/v0.3.3.md).
      - name: Create or update release
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="release-notes/${tag}.md"
          if [ ! -f "$notes" ]; then
            echo "::warning::Release notes file not found: $notes"
            notes=/dev/null
          fi
          files=$(find artifacts -type f)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" $files --title "NapkinUML $tag" --notes-file "$notes"
          fi
